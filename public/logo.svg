<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="holo-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="35%" stop-color="#c4b5fd"/>
      <stop offset="65%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="holo-wing-l" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64f4d0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="holo-wing-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="halo-glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="halo-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="33%" stop-color="#c4b5fd"/>
      <stop offset="66%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <circle cx="32" cy="28" r="22" fill="url(#halo-glow)"/>

  <!-- Left wing — geometric crystal fragments -->
  <g filter="url(#glow)">
    <path d="M8 36 L18 22 L22 28 L14 40 Z" fill="url(#holo-wing-l)" stroke="url(#holo-main)" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M6 44 L14 40 L18 34 L10 48 Z" fill="url(#holo-wing-l)" fill-opacity="0.75" stroke="url(#holo-main)" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M14 40 L22 28 L26 32 L18 46 Z" fill="url(#holo-wing-l)" fill-opacity="0.6" stroke="url(#holo-main)" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M10 48 L18 46 L22 38 L14 52 Z" fill="url(#holo-wing-l)" fill-opacity="0.45" stroke="url(#holo-main)" stroke-width="0.4" stroke-linejoin="round"/>
    <path d="M18 22 L24 16 L28 22 L22 28 Z" fill="url(#holo-wing-l)" fill-opacity="0.85" stroke="url(#holo-main)" stroke-width="0.5" stroke-linejoin="round"/>
  </g>

  <!-- Right wing — mirrored fragments -->
  <g filter="url(#glow)">
    <path d="M56 36 L46 22 L42 28 L50 40 Z" fill="url(#holo-wing-r)" stroke="url(#holo-main)" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M58 44 L50 40 L46 34 L54 48 Z" fill="url(#holo-wing-r)" fill-opacity="0.75" stroke="url(#holo-main)" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M50 40 L42 28 L38 32 L46 46 Z" fill="url(#holo-wing-r)" fill-opacity="0.6" stroke="url(#holo-main)" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M54 48 L46 46 L42 38 L50 52 Z" fill="url(#holo-wing-r)" fill-opacity="0.45" stroke="url(#holo-main)" stroke-width="0.4" stroke-linejoin="round"/>
    <path d="M46 22 L40 16 L36 22 L42 28 Z" fill="url(#holo-wing-r)" fill-opacity="0.85" stroke="url(#holo-main)" stroke-width="0.5" stroke-linejoin="round"/>
  </g>

  <!-- Tech halo ring -->
  <circle cx="32" cy="22" r="11" fill="none" stroke="url(#halo-ring)" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.9"/>
  <circle cx="32" cy="22" r="8.5" fill="none" stroke="url(#halo-ring)" stroke-width="0.8" opacity="0.5"/>

  <!-- Inner token / DAO motif -->
  <circle cx="32" cy="22" r="5" fill="#0c0a09" stroke="url(#holo-main)" stroke-width="0.8"/>
  <path d="M32 18.5 L34.5 24 L29.5 24 Z" fill="url(#holo-main)" opacity="0.9"/>
  <circle cx="32" cy="22" r="1.2" fill="#e2e8f0"/>
  <line x1="32" y1="16.5" x2="32" y2="14" stroke="url(#holo-main)" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="37.5" y1="22" x2="40" y2="22" stroke="url(#holo-main)" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="32" y1="27.5" x2="32" y2="30" stroke="url(#holo-main)" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="26.5" y1="22" x2="24" y2="22" stroke="url(#holo-main)" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Center bridge fragment -->
  <path d="M28 34 L32 30 L36 34 L32 38 Z" fill="url(#holo-main)" fill-opacity="0.7" stroke="url(#holo-main)" stroke-width="0.5"/>

  <!-- Shine overlay -->
  <ellipse cx="28" cy="20" rx="8" ry="5" fill="url(#shine)" opacity="0.3" transform="rotate(-15 28 20)"/>
</svg>
