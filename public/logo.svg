<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="tc-holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="tc-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tc-glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="tc-soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="url(#tc-glow)"/>

  <!-- Hexagonal blockchain frame -->
  <path d="M32 8 L50 18.5 V39.5 L32 50 L14 39.5 V18.5 Z" stroke="url(#tc-holo)" stroke-width="1.2" fill="none" opacity="0.85"/>
  <path d="M32 13 L45.5 21 V35 L32 43 L18.5 35 V21 Z" stroke="url(#tc-holo)" stroke-width="0.6" fill="none" opacity="0.35"/>

  <!-- Corner cubes -->
  <g fill="url(#tc-holo)" opacity="0.9">
    <rect x="29" y="5" width="6" height="6" rx="1" transform="rotate(0 32 8)"/>
    <rect x="47" y="16" width="5" height="5" rx="0.8"/>
    <rect x="47" y="37" width="5" height="5" rx="0.8"/>
    <rect x="29" y="47" width="6" height="6" rx="1"/>
    <rect x="12" y="37" width="5" height="5" rx="0.8"/>
    <rect x="12" y="16" width="5" height="5" rx="0.8"/>
  </g>

  <!-- Connector nodes -->
  <circle cx="32" cy="8" r="1.5" fill="#5eead4"/>
  <circle cx="50" cy="18.5" r="1.2" fill="#7dd3fc"/>
  <circle cx="50" cy="39.5" r="1.2" fill="#a78bfa"/>
  <circle cx="32" cy="50" r="1.5" fill="#c084fc"/>
  <circle cx="14" cy="39.5" r="1.2" fill="#a78bfa"/>
  <circle cx="14" cy="18.5" r="1.2" fill="#5eead4"/>

  <!-- CT monogram glass plate -->
  <rect x="17" y="19" width="30" height="22" rx="6" fill="#0c0a09" stroke="url(#tc-holo)" stroke-width="0.8" opacity="0.95"/>
  <rect x="17" y="19" width="30" height="10" rx="6" fill="url(#tc-shine)" opacity="0.5"/>

  <!-- C letterform -->
  <path d="M27 28 C27 24.5 24.5 22 21.5 22 C18.5 22 16 24.5 16 28 C16 31.5 18.5 34 21.5 34 C24.5 34 27 31.5 27 28" stroke="url(#tc-holo)" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(2 0)" filter="url(#tc-soft-glow)"/>

  <!-- T letterform -->
  <path d="M30 22 H42 M36 22 V34" stroke="url(#tc-holo)" stroke-width="2.4" fill="none" stroke-linecap="round" filter="url(#tc-soft-glow)"/>

  <!-- Faceted heart motif -->
  <path d="M32 36.5 L29.5 34.2 C28.2 33 28.2 31 29.5 29.8 C30.5 28.9 32 29.5 32 30.5 C32 29.5 33.5 28.9 34.5 29.8 C35.8 31 35.8 33 34.5 34.2 Z" fill="url(#tc-holo)" opacity="0.75"/>
  <path d="M32 30.8 L33.2 32.4 L32 34 L30.8 32.4 Z" fill="#ffffff" opacity="0.35"/>
</svg>
